project:
  name: aic_virtual_staining
  output_root: outputs
  artifact_root: artifacts
  seed: 2026

data:
  root: AUTO
  organ: auto
  train_split: train
  val_split: val
  test_split: test
  targets: [HLA-DR, CD45RO, Vimentin, CD68]
  submit_targets: [CD68]
  group_key: roi_id
  val_ratio: 0.2
  surrogate_group_size: 32
  smoke_count: 8
  image_size: 256
  input_mode: auto
  target_modes: auto
  num_workers: 8
  pin_memory: true
  persistent_workers: true
  max_train_samples: null
  max_val_samples: null
  grouped_inner_folds:
    enabled: false
    fold_count: 5
    seed: 2026
    require_official_train: true
    coordinate_source: filename
    output_csv: artifacts/performance_v2/inner_fold_assignments.csv
  activity_sampler:
    enabled: false
    activity_key: target_activity
    num_bins: 4
    seed: 2026
    num_samples: null

model:
  name: multi_marker_restorer
  base_channels: 48
  encoder_depths: [2, 2, 4, 6]
  decoder_depths: [2, 2, 2]
  use_sobel_input: true
  use_task_adapters: true
  use_prototypes: true
  shared_prototypes: 8
  task_prototypes: 8
  prototype_temperature: 0.1
  deep_supervision: true
  output_activation: sigmoid
  context:
    enabled: false
    grid_size: 3
    missing_policy: center
    include_center: true
    cache_size: 0
    token_dim: 128
    encoder_width: 24
    context_dropout: 0.1
    fusion_scales: [4, 8, 16]
    bottleneck_cross_attention: false
    residual_init: 0.0
    stop_gradient: false
    require_verified_grid: true
    coordinate_source: filename
    allow_numeric_stem_inference: false
    allow_edge_graph_inference: false
    tile_chunk_size: 9

loss:
  mse: 0.0
  charbonnier: 0.40
  ssim: 0.35
  ms_ssim: 0.10
  gradient: 0.10
  frequency: 0.05
  structure_weight_alpha: 1.0
  correlation: 0.02
  prototype_activation: 0.001
  prototype_diversity: 0.001
  deep_supervision_weights: [1.0, 0.5, 0.25]
  pyramid: 0.0
  statistics: 0.0
  schedule: constant
  phase_a_ratio: 0.7
  # Optional target-derived bright-protein supervision. It never uses test data
  # and defaults off so legacy runs and checkpoints remain unchanged.
  fluorescence_foreground:
    enabled: false
    weight: 0.0
    threshold_std_scale: 0.25
    temperature: 0.05
    mse_weight: 1.0
    dice_weight: 0.10
    intensity_weight: 0.25
    min_activity_std: 0.01

train:
  device: auto
  hardware_profile: auto
  epochs: 200
  batch_size: auto
  gradient_accumulation: auto
  optimizer: adamw
  lr: 0.0002
  weight_decay: 0.0001
  warmup_epochs: 5
  scheduler: cosine
  amp: true
  amp_dtype: auto
  grad_clip: 1.0
  ema: true
  ema_decay: 0.999
  early_stopping_patience: 30
  save_top_k: 3
  # Legacy default saves three best-metric aliases. Space-conscious runs may
  # set [ssim]; last.ckpt is always retained for resume.
  checkpoint_metrics: [ssim, psnr, proxy]
  resume: null
  # Fixed 256x256 patches allow cuDNN to reuse an optimized convolution plan.
  deterministic: false
  cudnn_benchmark: true
  max_oom_retries: 3
  # auto: show batch progress only in an interactive terminal (for example AutoDL SSH).
  # It stays off for nohup/redirection so train.log remains easy to read with tail.
  progress_bar: auto
  progress_bar_refresh_seconds: 1.0
  # Async metric logging keeps loss/components as on-device 0-dim tensors during
  # the hot path and synchronizes once per epoch (or every batch_metric_log_interval
  # batches). Default false preserves the legacy per-batch CUDA->CPU sync behaviour
  # so existing A/B comparisons and checkpoint provenance stay bit-identical.
  async_metric_logging: false
  # 0 = synchronize accumulated metrics only at epoch end. >0 = additionally sync
  # every N batches for live logging (useful with an interactive progress bar).
  batch_metric_log_interval: 0
  # Validate every N epochs. Default 1 preserves legacy behaviour. Screen runs may
  # set 5 to skip validation on intermediate epochs; skipped epochs never update
  # best checkpoints and are recorded as unvalidated.
  validate_every_n_epochs: 1
  # False keeps aggregate metrics but omits repeated per-image validation rows
  # from every checkpoint/history entry. Final validation still writes its own
  # per-image CSV. True preserves the exact legacy checkpoint payload.
  retain_validation_records_in_history: true
  # torch.set_float32_matmul_precision. Default "highest" preserves legacy
  # numerics; "high"/"medium" are A/B candidates on Ampere+ GPUs.
  # CUDA Tensor Core GPUs can use TF32 inner products with "high".
  float32_matmul_precision: high
  # channels_last memory format for convolution-dense models on Tensor Core
  # GPUs (Ampere+). The model and input tensors are converted to NHWC
  # so conv kernels hit the Tensor Core's 8-channel tile path. Safe for the
  # NAF/Restormer-lite stack (verified: all reshape/layer_norm paths are
  # channels_last-compatible).
  channels_last: true
  # Optional torch.profiler trace over the first N training batches. Disabled by
  # default so production training never pays profiling overhead.
  profiler:
    enabled: false
    max_steps: 30
    output_dir: null
    record_shapes: false
    with_stack: false
  # Optional torch.compile of the model forward. Disabled by default; first
  # epochs pay compile cost, so always A/B over >=5 epochs and fall back to eager
  # on failure. mode maps to torch.compile mode.
  compile:
    enabled: false
    mode: default
    backend: inductor
  prototype_monitor:
    enabled: false
    dead_threshold: 0.0001
    attention_visuals_enabled: false
    attention_visual_count: 4
    attention_visual_seed: 2026
    attention_visual_size: 256

validation:
  primary_metric: ssim
  primary_domain: float
  psnr_norm_min: 15.0
  psnr_norm_max: 40.0
  save_visuals: true
  worst_k: 32
  group_by_roi: true
  bootstrap_by_roi: false
  bootstrap_samples: 1000
  save_predictions: false
  domains: [float]

inference:
  device: auto
  batch_size: auto
  use_ema: true
  tta: d4
  # configured: inference.tta is authoritative. validation_decision: a saved
  # per-target tta_decisions.json may enable or disable D4.
  tta_policy: configured
  ensemble_checkpoints: []
  jpeg_quality: 100
  jpeg_subsampling: 0
  jpeg_optimize: false
  context: false
  weight_source: auto

multitask:
  optimizer: equal
  gradient_cosine_enabled: false
  log_gradient_cosine_every: 500

pretrain:
  enabled: false
  mask_ratio: 0.5
  block_size: 16
  epochs: 50
  lr: 0.0002
  context_encoder: false
  neighbor_consistency: false
  neighbor_consistency_weight: 0.0

ensemble:
  method: uniform
  weights: []
  validation_only: true
  optimizer: coordinate
  optimizer_failure_policy: uniform
  cross_validate_weights: true
  allow_range_wise: false
  weight_source: best_jpg
  allow_unsafe_model_soup_lineage: false
  allow_unsafe_model_soup_validation: false

budget:
  active: full
  smoke: {epochs: 2, max_train_samples: 64, max_val_samples: 32}
  screen: {epochs: 20, folds: [0], seeds: [2026]}
  confirm: {epochs: 80, folds: [0, 1], seeds: [2026]}
  full: {epochs: 120, folds: [], seeds: [2026]}

submission:
  root_name: results
  split_name: test
  fake_suffix: _fake
  extension: .jpg
  create_zip: true
  official: true
  allow_smoke_manifest: false
