project: {output_root: outputs/performance_v2, artifact_root: artifacts/performance_v2}
data: {targets: [CD68], submit_targets: [CD68]}
model:
  name: multi_marker_restorer
  base_channels: 32
  use_sobel_input: true
  use_task_adapters: true
  use_prototypes: true
  base_detail: false
  context: {enabled: false, require_verified_grid: true, coordinate_source: filename, allow_numeric_stem_inference: false, allow_edge_graph_inference: false, cache_size: 0}
loss:
  schedule: constant
  mse: 0.0
  charbonnier: 0.40
  ssim: 0.35
  ms_ssim: 0.10
  gradient: 0.10
  frequency: 0.05
  correlation: 0.02
  prototype_activation: 0.001
  prototype_diversity: 0.001
train: {epochs: 120, batch_size: 2, gradient_accumulation: 4, ema: true}
validation: {primary_domain: jpg, domains: [float, uint8, jpg], group_by_roi: true, bootstrap_by_roi: true, bootstrap_samples: 1000}
inference: {use_ema: false, tta: none}
budget: {active: full}
